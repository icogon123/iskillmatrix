<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07061a" />
    <meta name="description" content="Practical online courses in AI tools, graphic design, video editing, social media, marketing and more." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="iSkillMatrix" />
    <meta property="og:title" content="iSkillMatrix — Online courses in trending digital skills" />
    <meta property="og:description" content="Practical online courses in AI tools, graphic design, video editing, social media, marketing and more." />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>iSkillMatrix — Online courses in trending digital skills</title>
    <script>
      // Apply the theme before the first paint (same rules as src/lib/useTheme.js): the website is always light,
      // the member and admin apps use the saved choice (light unless the user picked dark).
      (function (p) {
        var app = /^\/(app|admin)(\/|$)/.test(p) && p !== '/admin/login';
        var dark = false;
        try { dark = app && localStorage.getItem('ism-theme') === 'dark'; } catch (e) {}
        if (!dark) document.documentElement.classList.add('theme-light');
        if (app) document.documentElement.classList.add('surface-app');
      })(location.pathname);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
